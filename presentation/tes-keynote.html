<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuvo — TES 2026 · Keynote mode</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{
    --navy:#0a1a33; --navy-deep:#07152b; --navy-2:#102a52; --blue-bright:#1268ff; --blue:#0755dd; --blue-light:#4d94ff;
    --green:#27c947; --red:#ec1c2b; --surface-blue:#edf5ff; --bg:#f6f8ff; --ink:#0c1320; --muted:#5a6b82;
    --display:"Barlow Condensed","Arial Narrow",Archivo,system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  body{background:var(--bg);transition:background .6s}
  body[data-theme=dark]{background:var(--navy-deep);color:#fff}
  body[data-theme=blue]{background:var(--blue-bright);color:#fff}
  body.hide-cursor{cursor:none}
  .dotbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(10,26,51,.10) 1.6px,transparent 1.8px);background-size:34px 34px}
  body[data-theme=dark] .dotbg{background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.8px)}
  body[data-theme=blue] .dotbg{background-image:radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 1.8px)}
  .blob{position:fixed;border-radius:50%;z-index:0;pointer-events:none}
  #b1{width:60vmax;height:60vmax;background:radial-gradient(circle,rgba(18,104,255,.28),transparent 65%);left:-18vmax;top:-26vmax}
  #b2{width:55vmax;height:55vmax;background:radial-gradient(circle,rgba(77,148,255,.28),transparent 65%);right:-18vmax;bottom:-26vmax}
  body[data-theme=dark] #b1{background:radial-gradient(circle,rgba(18,104,255,.45),transparent 65%)}
  #amb{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;z-index:2;overflow:hidden}
  .scene{position:absolute;inset:0}
  .abs{position:absolute}
  .hid{visibility:hidden;opacity:0}

  .chip{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 30px;border-radius:999px;border:3px solid var(--navy-deep);background:#fff;color:var(--navy-deep);
    font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.06em;text-transform:uppercase;box-shadow:5px 5px 0 var(--navy-deep);white-space:nowrap}
  .chip.b{background:var(--blue-bright);color:#fff}.chip.g{background:var(--green)}.chip.r{background:var(--red);color:#fff}
  .chip.k{background:var(--navy-deep);color:#fff;border-color:#fff;box-shadow:5px 5px 0 var(--blue-bright)}
  .chip.lg{height:84px;font-size:52px;padding:0 44px}
  .card{--sh:10px;--shc:var(--navy-deep);background:#fff;color:var(--ink);border:3px solid var(--navy-deep);border-radius:18px;box-shadow:var(--sh) var(--sh) 0 var(--shc)}
  .disp{font-family:var(--display);font-weight:900;text-transform:uppercase}
  .hl{display:inline-block;background:var(--blue-bright);color:#fff;border-radius:.16em;box-shadow:.055em .07em 0 var(--navy-deep);transform:rotate(-1.6deg);padding:0 .16em .02em}
  .m{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .16em .2em;margin:-.04em -.16em -.2em}
  .m>.i{display:inline-block}
  .tile{position:relative;background:#4f93ff;border:3px solid var(--navy-deep);box-shadow:14px 14px 0 var(--navy-deep)}
  .tile .lw{position:absolute}.tile .lw img{position:absolute;inset:0;width:100%;height:100%}
  .tile .dt{position:absolute;left:50.6%;top:3.2%;width:20.2%;aspect-ratio:1;border-radius:50%;background:#0663ff}
  .circ{width:140px;height:140px;border-radius:50%;background:#fff;border:3px solid var(--navy-deep);box-shadow:6px 6px 0 var(--navy-deep);display:flex;align-items:center;justify-content:center;color:var(--blue-bright)}
  .av2 img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;border-radius:50%;filter:grayscale(1) contrast(.85) brightness(1.08);opacity:.7;transition:filter .5s,opacity .5s}
  .av2.on img{filter:none;opacity:1}
  .av2{overflow:hidden;width:300px;height:300px;border-radius:50%;border:6px dashed #9fb0cf;background:#eef1f7;color:#9fb0cf;display:flex;align-items:center;justify-content:center}
  .av2.on{border:6px solid var(--navy-deep);background:var(--blue-bright);color:#fff;box-shadow:12px 12px 0 var(--navy-deep)}
  .row{position:absolute;left:0;right:0;top:0;height:92px;border:3px solid var(--navy-deep);border-radius:16px;background:#fff;color:var(--ink);display:flex;align-items:center;padding:0 22px;gap:18px;box-shadow:5px 5px 0 var(--navy-deep)}
  .row.me{background:var(--surface-blue)}
  .row .rk{font:900 46px var(--display);width:40px;text-align:center}
  .row img.av{object-fit:cover;object-position:50% 25%;background:#c9d3e6}
  .row .nm{width:150px!important}
  .row .av{width:54px;height:54px;border-radius:50%;background:var(--navy-2);color:#fff;display:flex;align-items:center;justify-content:center;font:900 28px var(--display);flex:none}
  .row.me .av{background:var(--blue-bright)}
  .row .nm{font:800 36px var(--display);letter-spacing:.04em;width:120px}
  .row .tr{flex:1;height:22px;border-radius:12px;background:#e2e8f2;overflow:hidden}
  .row .tr i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--blue-bright),var(--blue-light))}
  .row .sc{font:800 34px var(--display);width:60px;text-align:right}
  .d21{display:block;width:58px;height:58px;border-radius:50%;background:var(--blue-bright);border:3px solid var(--navy-deep);visibility:hidden}
  .phone{position:relative;border-radius:60px;background:#05070d;padding:11px;border:3px solid #26324f;box-shadow:0 0 0 3px var(--blue-bright),20px 20px 0 rgba(18,104,255,.9)}
  .phone video{display:block;width:100%;height:100%;object-fit:cover;border-radius:48px;background:#111}
  .phone:before{content:"";position:absolute;top:22px;left:50%;width:30%;height:26px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:2}
  svg text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800}
  .avc{border-radius:50%;background:var(--navy-2);color:#fff;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font:900 52px var(--display)}

  /* chrome */
  .curtain{position:fixed;inset:0;z-index:40;transform:translateX(-101%);pointer-events:none}
  #c1{background:var(--blue-bright)}#c2{background:var(--navy-deep)}
  #progress{position:fixed;left:0;bottom:0;height:6px;width:100%;background:var(--blue-bright);transform-origin:left;transform:scaleX(0);z-index:60;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  #hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:70;font:700 20px var(--display);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy-deep);padding:12px 26px;border-radius:30px;opacity:0;pointer-events:none;white-space:nowrap}
  #black{position:fixed;inset:0;background:#000;z-index:100;opacity:0;pointer-events:none;transition:opacity .35s}#black.on{opacity:1}
  #timer{position:fixed;left:26px;bottom:26px;z-index:75;display:none;font:800 30px var(--display);letter-spacing:.06em;background:var(--navy-deep);color:#fff;padding:10px 22px;border-radius:14px}
  #timer.on{display:block}#timer small{font-size:18px;opacity:.7;margin-left:12px}
  #loader{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  #loader img{width:150px;height:150px;border-radius:38px;border:3px solid var(--navy-deep);box-shadow:8px 8px 0 var(--navy-deep)}
  #loader .bar2{width:300px;height:18px;border-radius:12px;border:3px solid var(--navy-deep);background:#fff;overflow:hidden}
  #loader .bar2 i{display:block;height:100%;width:0;background:var(--blue-bright)}
  /* speaker lower-third with live equalizer */
  #speaker{position:fixed;right:34px;bottom:30px;z-index:35;display:flex;align-items:center;gap:14px;height:68px;padding:0 24px 0 10px;border-radius:999px;border:3px solid var(--navy-deep);background:#fff;color:var(--navy-deep);box-shadow:5px 5px 0 var(--navy-deep);opacity:0;transform:translateY(30px);transition:opacity .4s,transform .4s}
  #speaker.on{opacity:1;transform:none}
  #speaker .ini{width:48px;height:48px;border-radius:50%;background:var(--blue-bright);color:#fff;display:flex;align-items:center;justify-content:center;font:900 28px var(--display)}
  #speaker.S .ini{background:var(--green);color:var(--navy-deep)}
  #speaker .nm{font:800 28px var(--display);letter-spacing:.12em}
  #speaker .eq{display:flex;align-items:center;gap:4px;height:36px}
  #speaker .eq i{display:block;width:6px;height:100%;border-radius:3px;background:var(--blue-bright);transform-origin:center;animation:eq .7s ease-in-out infinite alternate}
  #speaker.S .eq i{background:var(--green)}
  #speaker .eq i:nth-child(2){animation-delay:-.2s;animation-duration:.55s}#speaker .eq i:nth-child(3){animation-delay:-.45s;animation-duration:.8s}
  #speaker .eq i:nth-child(4){animation-delay:-.1s;animation-duration:.6s}#speaker .eq i:nth-child(5){animation-delay:-.35s;animation-duration:.75s}
  @keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
  body[data-theme=dark] #speaker,body[data-theme=blue] #speaker{border-color:#fff;box-shadow:5px 5px 0 var(--blue-bright)}

  /* ===== modes: present = clean audience view, practice = coaching HUD ===== */
  #speaker{display:none!important}
  body[data-mode=present] #progress,body[data-mode=present] #hint,body[data-mode=present] #timer,
  body[data-mode=present] #practice,body[data-mode=present] #turn,body[data-mode=present] #frame{display:none!important}
  body[data-mode=practice] #stage{top:calc(50% - 105px)}
  body[data-mode=run] #stage{left:31%}
  body.lite .blob,body.lite #amb,body.lite #fx{display:none!important}
  body.lite .dotbg{display:none}
  body[data-mode=practice] #hint{bottom:232px}
  #practice{position:fixed;left:0;right:0;bottom:0;height:210px;z-index:36;background:rgba(7,21,43,.96);color:#fff;border-top:4px solid var(--blue-bright);display:grid;grid-template-columns:300px 1fr 260px;grid-template-rows:1fr 34px;align-items:center;font-family:var(--display)}
  #practice .pl{display:flex;align-items:center;gap:16px;padding:0 24px;border-right:2px solid #1b2e57;height:100%}
  #practice .ini{width:84px;height:84px;border-radius:50%;background:var(--blue-bright);color:#fff;display:flex;align-items:center;justify-content:center;font:900 52px var(--display);flex:none;transition:background .2s}
  #practice.S .ini{background:var(--green);color:var(--navy-deep)}
  #practice .who{font-size:44px;font-weight:900;letter-spacing:.08em;line-height:1}
  #practice .sub{font-size:22px;letter-spacing:.2em;color:#8fa3c7;font-weight:800;margin-top:4px}
  #practice .pc{padding:0 28px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden}
  #practice .line{font-size:44px;font-weight:700;line-height:1.08;color:#5f7499}
  #practice .line span{transition:color .12s}#practice .line span.d{color:#fff}#practice .line span.n{color:#4d94ff}
  #practice.S .line span.n{color:#27c947}
  #practice .nxt{font-size:26px;color:#8fa3c7;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #practice .nxt b.A{color:#4d94ff}#practice .nxt b.S{color:#27c947}
  #practice .pr{text-align:right;padding:0 24px;border-left:2px solid #1b2e57;height:100%;display:flex;flex-direction:column;justify-content:center}
  #practice .cd{font-size:70px;font-weight:900;line-height:1}#practice .cd small{font-size:28px;color:#8fa3c7}
  #practice .tm{font-size:28px;color:#8fa3c7;font-weight:800;letter-spacing:.08em;margin-top:4px}
  #practice .tl{grid-column:1/4;position:relative;height:34px;display:flex;gap:2px;padding:0 6px 6px;align-items:stretch}
  #practice .tl i{display:block;border-radius:3px;opacity:.55}#practice .tl i.A{background:#1268ff}#practice .tl i.S{background:#27c947}
  #practice .tl .ph{position:absolute;top:0;bottom:4px;width:4px;background:#fff;border-radius:2px;left:0;box-shadow:0 0 12px #fff;opacity:1}
  #practice .tl i.cur{opacity:1}
  #turn{position:fixed;top:26px;left:50%;transform:translate(-50%,-140px);z-index:80;font:900 64px var(--display);letter-spacing:.1em;padding:10px 40px;border-radius:999px;border:4px solid #fff;color:#fff;background:var(--blue-bright);box-shadow:8px 8px 0 var(--navy-deep);transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
  #turn.S{background:var(--green);color:var(--navy-deep)}#turn.on{transform:translate(-50%,0)}
  #frame{position:fixed;inset:0;z-index:79;pointer-events:none;border:0 solid var(--blue-bright);transition:border-width .15s,opacity .6s;opacity:0}
  #frame.S{border-color:var(--green)}#frame.on{border-width:14px;opacity:1}

  /* run-through: script panel */
  #script{display:none;position:fixed;right:0;top:0;bottom:0;width:38%;z-index:36;background:#07152b;color:#fff;border-left:4px solid var(--blue-bright);font-family:var(--display)}
  body[data-mode=run] #script{display:flex;flex-direction:column}
  body[data-mode=present] #script,body[data-mode=practice] #script{display:none}
  body[data-mode=run] #practice,body[data-mode=run] #progress{display:none!important}
  body[data-mode=run] #hint{display:none}
  #script .top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 22px;background:#0a1a33;border-bottom:3px solid #1b2e57;font-weight:800;letter-spacing:.08em}
  #script .cd2{font-size:40px;font-weight:900}#script .cd2 small{font-size:20px;color:#8fa3c7;margin-left:8px}#script .tm2{font-size:26px;color:#8fa3c7}
  #script .list{flex:1;overflow:auto;padding:10px 0 40vh;scroll-behavior:smooth}
  #script .sec{padding:18px 22px 4px;font-size:22px;letter-spacing:.2em;color:#4d94ff;font-weight:800;text-transform:uppercase}
  #script .ln{padding:10px 22px 10px 18px;border-left:6px solid transparent;cursor:pointer;opacity:.5;transition:opacity .2s,background .2s}
  #script .ln b{display:block;font-size:20px;letter-spacing:.2em;font-weight:900}
  #script .ln.A b{color:#4d94ff}#script .ln.S b{color:#27c947}
  #script .ln span{display:block;font-size:34px;line-height:1.12;font-weight:700}
  #script .ln.cur{opacity:1;background:rgba(18,104,255,.18);border-left-color:#4d94ff}#script .ln.S.cur{background:rgba(39,201,71,.14);border-left-color:#27c947}
  #script .ln.cur span{font-size:42px}
  #script u{text-decoration:none;color:#6f84ab}#script u.d{color:#fff}#script u.n{color:#4d94ff}#script .ln.S u.n{color:#27c947}
  /* countdown */
  #count{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:85;font:900 340px/1 var(--display);color:#fff;text-shadow:0 8px 0 var(--navy-deep);-webkit-text-stroke:10px var(--navy-deep);paint-order:stroke fill;opacity:0;pointer-events:none}
  body[data-mode=present] #count{top:auto;left:34px;bottom:30px;transform:none;font-size:70px;-webkit-text-stroke:4px var(--navy-deep);opacity:.55!important}
  /* settings overlay */
  #sov{position:fixed;inset:0;z-index:95;background:rgba(7,21,43,.55);display:none;align-items:center;justify-content:center;padding:20px}
  #sov.on{display:flex}
  #sov .panel{position:relative;background:#fff;border:3px solid var(--navy-deep);border-radius:18px;box-shadow:10px 10px 0 var(--blue-bright);width:min(560px,100%);max-height:92vh;overflow:auto;padding:26px 28px}
  #sov h3{font:900 44px var(--display);text-transform:uppercase;margin-bottom:12px;color:var(--navy-deep)}
  #sov .x{position:absolute;right:16px;top:12px;width:44px;height:44px;border-radius:50%;border:3px solid var(--navy-deep);background:#fff;font:900 30px/1 var(--display);cursor:pointer}
  #sov .foot{font-size:14px;color:#5a6b82;margin-top:14px}

  /* ===== keynote redesign helpers ===== */
  .vidbg{position:absolute;inset:0;overflow:hidden}
  .vidbg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) contrast(1.1);transform:scale(1.04)}
  .vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0%,rgba(7,21,43,.55) 70%,rgba(7,21,43,.82) 100%);pointer-events:none}
  .bigwords{position:absolute;left:0;right:0;text-align:center;font:900 180px/1 var(--display);text-transform:uppercase;letter-spacing:-.02em}
  .bigwords .m{display:inline-block;overflow:hidden;padding:.04em .14em .18em;margin:-.04em -.14em -.18em}
  .bigwords .i{display:inline-block}
  .subwords{position:absolute;left:0;right:0;text-align:center;font:700 46px/1.25 var(--body);max-width:1200px;margin:0 auto;padding:0 40px;opacity:.92}
  .ribbon{position:absolute;left:0;right:0;height:8px;background:var(--blue-bright);border-radius:4px;transform-origin:left center;transform:scaleX(0)}
  .statbox{position:absolute;background:#fff;border:3px solid var(--navy-deep);border-radius:18px;box-shadow:10px 10px 0 var(--navy-deep);padding:28px 34px}
  .demo-fallback{position:absolute;inset:0;background:rgba(7,21,43,.85);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  .demo-fallback.on{opacity:1;pointer-events:auto}
  .demo-fallback .msg{background:#fff;border:3px solid var(--navy-deep);border-radius:18px;padding:28px 40px;font:800 34px var(--display);letter-spacing:.04em;box-shadow:8px 8px 0 var(--blue-bright);display:flex;align-items:center;gap:16px}
  .glow-blue{box-shadow:0 0 80px rgba(18,104,255,.55),0 0 24px rgba(18,104,255,.35)}
  .kicker{font:800 32px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-light)}
  .mask-clip{overflow:hidden;display:inline-block}
  .mask-clip>span{display:inline-block;transform:translateY(110%)}
  .phone-frame{position:relative;border-radius:58px;background:#05070d;padding:11px;border:3px solid #26324f;box-shadow:0 0 0 3px var(--blue-bright),20px 20px 0 rgba(18,104,255,.9)}
  .phone-frame video{display:block;width:100%;height:100%;object-fit:cover;border-radius:46px;background:#111}
  .phone-frame:before{content:"";position:absolute;top:22px;left:50%;width:30%;height:26px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:2}
</style>
</head>
<body data-theme="light">
<div class="dotbg"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div><canvas id="amb"></canvas><canvas id="fx"></canvas>
<div id="stage"></div>
<div id="speaker"><span class="ini">A</span><span class="nm">AKAASH</span><span class="eq"><i></i><i></i><i></i><i></i><i></i></span></div>
<div class="curtain" id="c1"></div><div class="curtain" id="c2"></div>
<div id="progress"></div><div id="timer"></div><div id="hint"></div><div id="black"></div>
<div id="practice"><div class="pl"><span class="ini">A</span><div><div class="who">AKAASH</div><div class="sub">YOUR LINE</div></div></div>
  <div class="pc"><div class="line"></div><div class="nxt"></div></div>
  <div class="pr"><div class="cd">–</div><div class="tm">0:00 / 0:00</div></div><div class="tl"></div></div>
<div id="turn"></div><div id="frame"></div>
<div id="script"><div class="top"><div class="cd2"></div><div class="tm2"></div></div><div class="list"></div></div>
<div id="count"></div>
<div id="sov"><div class="panel"><button class="x" aria-label="Close">×</button><h3>Settings</h3><div class="box"></div><p class="foot">Saved on this computer. Press S or Esc to close.</p></div></div>
<div id="loader"><img src="assets/img/icon.png" alt=""><div class="bar2"><i></i></div></div>

<script src="assets/settings.js?v=10"></script>
<script src="vendor/gsap.min.js"></script>
<script>
/*
 * Nuvo keynote deck. See docs/ARCHITECTURE.md and docs/EDITING.md.
 *
 *  1. helpers / icons / background / confetti
 *  2. scenes: S.push({ title, theme, html(), init(), beats: [ bt(who, line, run, min) ] })
 *  3. DELIVERY table + buildSchedule(): per-line speed, pauses, per-speaker speed, 3:00 total
 *  4. engine: mount() / show() / advance() / clock / adaptive pace
 *  5. presenter window, practice HUD, run-through panel, settings overlay, input
 */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const stage = $('#stage'), rnd = gsap.utils.random;
  const DPR = .5;                                    // ambient/confetti canvases render at half resolution (cheap), they're soft decoration
  let ff = false;                                    // true while fast-forwarding (suppresses confetti)

  /* mode: ?mode=practice | present (default). M toggles. */
  const NS = window.NuvoSettings; let cfg = NS.get(); let LITE = cfg.perf === 'on';
  const setLite = v => { LITE = v; document.body.classList.toggle('lite', v); };
  const qm = (location.search.match(/[?&]mode=(\w+)/) || [])[1];
  if (qm) cfg = NS.set({ mode: qm === 'rehearse' ? 'run' : qm });

    const tl = $('.tl', pr); tl.innerHTML = '';
    beats.forEach((b, i) => { const e = document.createElement('i'); e.className = b.who; e.id = 'tl' + i; e.style.flex = (b.dur + b.gap) + ' 0 0'; tl.appendChild(e); });
    const ph = document.createElement('i'); ph.className = 'ph'; tl.appendChild(ph); builtTl = true;
  }
  function hud() {
    if (mode !== 'practice') return;
    if (!builtTl) buildTl();
    const b = beats[cur], n = beats[cur + 1], t = clockNow();
    if (!started || cur < 0) {
      pr.className = beats[0].who; $('.who', pr).textContent = 'READY'; $('.ini', pr).textContent = '▶'; $('.sub', pr).textContent = n ? 'PRESS → TO START' : '';
      $('.line', pr).innerHTML = '<span class="n">Cover is up. ' + (beats[0].who === 'A' ? 'Akaash' : 'Shaurya') + ' opens: “' + beats[0].line + '”</span>'; $('.nxt', pr).textContent = ''; $('.cd', pr).textContent = '–'; $('.tm', pr).textContent = '0:00 / ' + mmss(beats.total / pace); return;
    }
    pr.className = b.who; $('.who', pr).textContent = b.who === 'A' ? 'AKAASH' : 'SHAURYA'; $('.ini', pr).textContent = b.who; $('.sub', pr).textContent = 'YOUR LINE';
    const w = b.line.split(/\s+/), sp = b.dur, k = Math.min(w.length, Math.max(0, Math.floor((t - b.at) / sp * w.length)));
    const key = cur + ':' + k; if (pr._k !== key) { pr._k = key; $('.line', pr).innerHTML = w.map((x, i) => `<span class="${i < k ? 'd' : i === k ? 'n' : ''}">${x}</span>`).join(' '); }
    $('.nxt', pr).innerHTML = n ? `NEXT → <b class="${n.who}">${n.who === 'A' ? 'AKAASH' : 'SHAURYA'}</b>: ${n.line}` : 'END';
    const cd = n ? (n.at - t) / pace : 0; $('.cd', pr).innerHTML = n ? `${Math.max(0, cd).toFixed(1)}<small>s${t > b.at + b.dur ? ' · PAUSE' : b.r < .8 ? ' · SLOW' : b.r > 1.1 ? ' · FAST' : ''}</small>` : '–';
    $('.tm', pr).textContent = `${mmss(t / pace)} / ${mmss(beats.total / pace)}${paused ? ' · PAUSED' : auto ? '' : ' · MANUAL'}`;
    $$('.tl i', pr).forEach((e, i) => e.classList.toggle('cur', i === cur));
    const ph = $('.ph', pr); if (ph) ph.style.left = Math.min(100, t / beats.total * 100) + '%';
    if (b.who !== lastWho) { lastWho = b.who; turn.className = b.who + ' on'; turn.textContent = (b.who === 'A' ? 'AKAASH' : 'SHAURYA') + ' →'; frameEl.className = b.who + ' on'; clearTimeout(turnT); turnT = setTimeout(() => { turn.classList.remove('on'); frameEl.classList.remove('on'); }, 1300); }
  }
  setInterval(hud, 100);
  applyMode(mode);

  /* ---------- run-through: full script beside the slides ---------- */
  const sp = $('#script'); let builtSc = false, lastLn = -1;
  function buildScript() {
    let last = '', h = '';
    beats.forEach((b, i) => { if (b.scene !== last) { last = b.scene; h += `<div class="sec">${b.scene}</div>`; }
      h += `<div class="ln ${b.who}" id="ln${i}"><b>${b.who === 'A' ? 'AKAASH' : 'SHAURYA'}</b><span>${b.line}</span></div>`; });
    $('.list', sp).innerHTML = h; $$('.ln', sp).forEach((e, i) => e.onclick = () => { if (started) { show(i); rebase(); } }); builtSc = true;
  }
  function runHud() {
    if (!builtSc) buildScript();
    const b = beats[cur], n = beats[cur + 1], t = clockNow();
    $('.cd2', sp).innerHTML = started && cur >= 0 && n ? `${Math.max(0, (n.at - t) / pace).toFixed(1)}<small>s to next${t > b.at + b.dur ? ' · PAUSE' : b.r < .8 ? ' · SLOW' : b.r > 1.1 ? ' · FAST' : ''}</small>` : (counting ? '…' : started ? '' : 'Press → to start');
    $('.tm2', sp).textContent = started && cur >= 0 ? `${mmss(t / pace)} / ${mmss(beats.total / pace)}${paused ? ' · PAUSED' : auto ? '' : ' · MANUAL'}` : `0:00 / ${mmss(beats.total / pace)}`;
    if (!b) { $$('.ln.cur', sp).forEach(e => e.classList.remove('cur')); return; }
    if (lastLn !== cur) { const old = $('#ln' + lastLn, sp); if (old) { old.classList.remove('cur'); $('span', old).textContent = beats[lastLn].line; } const el = $('#ln' + cur, sp); el.classList.add('cur'); lastLn = cur; el.scrollIntoView({ block: 'center', behavior: 'smooth' }); sp._k = ''; }
    const w = b.line.split(/\s+/), spd = b.dur, k = Math.min(w.length, Math.max(0, Math.floor((t - b.at) / spd * w.length)));
    const key = cur + ':' + k; if (sp._k !== key) { sp._k = key; $('span', $('#ln' + cur, sp)).innerHTML = w.map((x, i) => `<u class="${i < k ? 'd' : i === k ? 'n' : ''}">${x}</u>`).join(' '); }
  }
  setInterval(() => { if (mode === 'run') runHud(); }, 100);
  sp.addEventListener('click', e => e.stopPropagation());

  /* ---------- settings overlay (S) ---------- */
  const sov = $('#sov'); let setPanel = null, wasPaused = true;
  function toggleSettings() { sov.classList.contains('on') ? closeSettings() : openSettings(); }
  function openSettings() { if (!setPanel) setPanel = NS.render($('.box', sov), { total: () => beats.total }); setPanel.refresh(); sov.classList.add('on'); wasPaused = paused; if (started && cur >= 0 && !paused) togglePause(); }
  function closeSettings() { if (!sov.classList.contains('on')) return; sov.classList.remove('on'); if (started && cur >= 0 && paused && !wasPaused) togglePause(); }
  $('.x', sov).onclick = closeSettings; sov.addEventListener('click', e => { e.stopPropagation(); if (e.target === sov) closeSettings(); });

  /* ---------- input ---------- */
  const timerEl = $('#timer');
  setInterval(() => { if (!started || cur < 0) return; const t = clockNow() / pace; timerEl.innerHTML = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}<small>beat ${cur + 1}/${beats.length} · ${auto ? (paused ? 'paused' : 'auto') : 'manual'}</small>`; }, 250);
  addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); advance(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); back(); }
    else if (k === ' ') { e.preventDefault(); if (!started || cur < 0) advance(); else togglePause(); }
    else if (k === 'a' || k === 'A') toggleAuto();
    else if (k === '+' || k === '=') setPace(.05);
    else if (k === '-' || k === '_') setPace(-.05);
    else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (k === 'b' || k === 'B' || k === '.') $('#black').classList.toggle('on');
    else if (k === 't' || k === 'T') timerEl.classList.toggle('on');
    else if (k === 'p' || k === 'P') openNotes();
    else if (k === 'm' || k === 'M') NS.set({ mode: { present: 'practice', practice: 'run', run: 'present' }[mode] });
    else if (k === 's' || k === 'S') toggleSettings();
    else if (k === 'Escape') closeSettings();
  });
  addEventListener('click', advance);
  let tx = 0; addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) dx < 0 ? advance() : back(); }, { passive: true });
  let idle; addEventListener('mousemove', () => { document.body.classList.remove('hide-cursor'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('hide-cursor'), 2200); });

  Promise.all([loadAll, document.fonts.ready]).then(() => {
    ready = true;
    advance();                       // shows the cover automatically; → then starts the talk
    const h = $('#hint'); h.textContent = '→ start / resync   ← back   Space pause   A auto   +/- pace   P presenter   M present mode   F fullscreen   T timer   B blackout';
    gsap.timeline({ delay: 3 }).to(h, { opacity: 1, duration: .6 }).to(h, { opacity: 0, duration: .8 }, '+=5');
  });
})();
</script>
</body>
